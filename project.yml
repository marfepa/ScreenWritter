name: ScreenWritter
options:
  bundleIdPrefix: com.screenwritter
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ScreenWritter:
    type: application
    platform: iOS
    sources:
      - path: ScreenWritter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenwritter.app
        INFOPLIST_FILE: ScreenWritter/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ScreenWritter/ScreenWritter.entitlements
    dependencies:
      - target: ScreenWritterShareExtension
  ScreenWritterShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenWritterShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenwritter.app.ShareExtension
        INFOPLIST_FILE: ScreenWritterShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenWritterShareExtension/ScreenWritterShareExtension.entitlements
        SKIP_INSTALL: true
  ScreenWritterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScreenWritterTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenwritter.app.tests
        INFOPLIST_FILE: ScreenWritterTests/Info.plist
    dependencies:
      - target: ScreenWritter
  ScreenWritterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScreenWritterUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenwritter.app.uitests
        INFOPLIST_FILE: ScreenWritterUITests/Info.plist
    dependencies:
      - target: ScreenWritter
